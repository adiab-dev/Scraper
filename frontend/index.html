<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scraper</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="header">
        <div class="searchBox">   
            <h1>Scrape for product</h1>
            <input type="text" id="searchQuery" placeholder="Enter search query">
            <button onclick="searchProduct()"><img src="assets/search_icon.svg" alt=""></button>
        </div>
        <div id="status">Status: Waiting for input...</div>
    </div>
    <div id="resultsDiv">
        
    </div>
    <script>
        async function searchProduct() {
            const statusBox = document.getElementById("status");
            const resultsDiv = document.getElementById("resultsDiv");
            const query = document.getElementById("searchQuery").value;

            if (!query) {
                statusBox.textContent = "Status: Please enter a product name!";
                return;
            }

            statusBox.textContent = "Status: Sending request to server...";

            try {
                const response = await fetch('/scrape', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ searchQuery: query }),
                });

                statusBox.textContent = "Status: Scraping started...";
                const products = await response.json();

                if (!products.length) {
                    statusBox.textContent = "Status: No results found.";
                    resultsDiv.innerHTML = "<p>No products available</p>";
                } else {
                    statusBox.textContent = "Status: Search complete!";
                    resultsDiv.innerHTML = products
                        .map(productItem => `
                        <a href="${productItem.link}" target="_blank" rel="noopener noreferrer">
                            <div class="productHolder">
                                <div class="productImage"><img src="${productItem.image}" alt="${productItem.title}"></div>
                                <div class="productInfo">
                                    <div class="productTitle">${productItem.title}</div>
                                    <p class="productPrice">Price: ${productItem.price} KD</p>
                                    <p class="productSite">Site: ${productItem.site}</p>
                                    <div class="buttonContainer">
                                        <button class="buyButton">Buy Now</button>
                                    </div>
                                </div>
                            </div>
                        </a>`)
                        .join('');
                }
            } catch (error) {
                statusBox.textContent = "Status: Error occurred!";
                console.error("Scraping error:", error);
            }
        }
    </script>
</body>

</html>
